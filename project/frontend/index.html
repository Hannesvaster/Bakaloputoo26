<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Nõustamisplatvorm</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-top">
        <h1>AI Nõustaja</h1>
        <p>Eesti väikeettevõtjatele</p>
      </div>

      <div class="sidebar-section">
        <h2>Näidisküsimused</h2>
        <button class="example-btn">Kuidas leida oma ettevõttele sihtrühm?</button>
        <button class="example-btn">Kuidas oma teenust hinnastada?</button>
        <button class="example-btn">Mis vahe on OÜ-l ja FIE-l?</button>
        <button class="example-btn">Millal peab käibemaksukohustuslasena registreerima?</button>
      </div>

      <div class="sidebar-section muted">
        <p>
          Prototüüp kasutab teadmistebaasi, retrievalit ja suurt keelemudelit.
        </p>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h2>Vestlus</h2>
          <p>Küsi praktilist nõu oma ettevõtte jaoks</p>
        </div>
      </header>

      <section id="chatBox" class="chat-box">
        <div class="message-row bot-row">
          <div class="avatar bot-avatar">AI</div>
          <div class="message bot">
            <div class="message-text">
              Tere! Küsi minult turunduse, ettevõtluse, maksude või Eesti ettevõtluskonteksti kohta.
            </div>
          </div>
        </div>
      </section>

      <footer class="input-area">
        <form id="chatForm" class="chat-form">
          <div class="input-wrapper">
            <textarea
              id="questionInput"
              placeholder="Kirjuta oma küsimus siia..."
              rows="1"
              required
            ></textarea>
            <button type="submit">Saada</button>
          </div>
        </form>
      </footer>
    </main>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
